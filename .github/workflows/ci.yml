name: ci

# The Foundation is a theme *and* a site, so this workflow runs three gates:
#
#   1. the fixture - the View layer renders identically across two skins
#   2. the neutrality guard - no brand, no analytics ID, no locale branching
#   3. the site - builds with no base theme, and builds again with PaperMod
#
# Gate 3 is the one that keeps the "optional base theme" claim honest. A
# Foundation that only built in its base-theme configuration would pass 1 and 2
# while quietly requiring PaperMod for its own pages.
#
# The toolchain is a matrix entry, not a loose variable, so the version and the
# two checksums can never drift apart: bumping the version without refreshing
# the checksums fails the download step. `matrix` is also the only context
# available to `jobs.<id>.name`, which is why the pin lives here.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    name: Hugo ${{ matrix.hugo }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Checksums published at
        # https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_0.167.0_checksums.txt
        include:
          - hugo: '0.167.0'
            hugo_sha256_linux: '0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957'
            hugo_sha256_windows: 'b04cdf0ae9098fe093ea90e1bd778d21649d71f55914d267aa60aa80b59074e0'
    env:
      HUGO_VERSION: ${{ matrix.hugo }}
      HUGO_SHA256_LINUX: ${{ matrix.hugo_sha256_linux }}
      HUGO_SHA256_WINDOWS: ${{ matrix.hugo_sha256_windows }}

    steps:
      # submodules: themes/PaperMod is the optional base theme of the site.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Extended is required, not optional: the gallery shortcode resizes page
      # resources, and the fixture would fail late and confusingly on the
      # non-extended build. The step below asserts the +extended suffix.
      - name: Install Hugo Extended (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          echo "${HUGO_SHA256_LINUX}  ${archive}" | sha256sum --check --status -
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Install Hugo Extended (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "hugo_extended_$($env:HUGO_VERSION)_windows-amd64.zip"
          $url = "https://github.com/gohugoio/hugo/releases/download/v$($env:HUGO_VERSION)/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:HUGO_SHA256_WINDOWS) {
            throw "checksum mismatch for ${archive}: expected $($env:HUGO_SHA256_WINDOWS), got ${actual}"
          }
          $target = Join-Path $env:RUNNER_TEMP 'hugo'
          Expand-Archive -Path $archive -DestinationPath $target -Force
          ($target -replace '\\', '/') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # A green run must name the toolchain that produced it. A runner that
      # picked up a different Hugo, or a non-extended build, fails here.
      - name: Assert the pinned version
        shell: bash
        run: |
          hugo version
          hugo version | grep -q "v${HUGO_VERSION}.*+extended" || {
            echo "expected Hugo v${HUGO_VERSION} extended, got: $(hugo version)" >&2
            exit 1
          }

      # The fixture is the regression gate for the View layer: the same markup
      # across skins, the Foundation stylesheet untouched by the skin choice,
      # and a committed DOM snapshot. It runs with --panicOnWarning.
      - name: Fixture build (Linux)
        if: runner.os == 'Linux'
        run: bash fixtures/build.sh

      - name: Fixture build (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File fixtures/build.ps1

      # A Foundation that has picked up a brand name, an analytics ID or another
      # theme's selector has broken R1 and R4 even if the build is green.
      - name: Neutrality guard (Linux)
        if: runner.os == 'Linux'
        run: bash fixtures/neutrality-check.sh

      - name: Neutrality guard (Windows)
        if: runner.os == 'Windows'
        run: pwsh -File fixtures/neutrality-check.ps1

      # Gate 3. The site must build with no base theme, and again with PaperMod.
      # No --panicOnWarning: PaperMod's own templates still use .Language.* keys
      # deprecated in Hugo 0.158.0, and that is upstream's to fix, not ours to
      # paper over by ignoring warnings.
      - name: Site build, no base theme (Linux)
        if: runner.os == 'Linux'
        run: hugo --source site --config hugo.yaml,hugo.no-base-theme.yaml --destination public-ci

      - name: Site build, no base theme (Windows)
        if: runner.os == 'Windows'
        run: hugo --source site --config hugo.yaml,hugo.no-base-theme.yaml --destination public-ci

      - name: Site build, with PaperMod (Linux)
        if: runner.os == 'Linux'
        run: hugo --source site --config hugo.yaml,hugo.with-base-theme.yaml --destination public-ci-pm

      - name: Site build, with PaperMod (Windows)
        if: runner.os == 'Windows'
        run: hugo --source site --config hugo.yaml,hugo.with-base-theme.yaml --destination public-ci-pm

      # The property docs/BASE-THEME.md §3 claims: the Foundation renders its
      # whole site on its own, and an optional base theme contributes exactly
      # one page. Asserted rather than measured by hand, because a claim in a
      # document that no gate checks is a claim that quietly stops being true.
      #
      # 12 with no base theme, 13 with PaperMod, and the one extra file is
      # 404.html. If a type ever needs a base theme to render, the Foundation
      # stops being a foundation and this fails.
      - name: Base theme contributes only its 404 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          list() { (cd "$1" && find . -name '*.html' | LC_ALL=C sort); }
          only_with=$(comm -13 <(list site/public-ci) <(list site/public-ci-pm))
          only_without=$(comm -23 <(list site/public-ci) <(list site/public-ci-pm))
          a=$(list site/public-ci | wc -l)
          b=$(list site/public-ci-pm | wc -l)
          if [ "$a" -ne 12 ] || [ "$b" -ne 13 ] || [ "$only_with" != "./404.html" ] || [ -n "$only_without" ]; then
            echo "expected 12 pages with no base theme, 13 with PaperMod, and only ./404.html added" >&2
            echo "  with no base theme: $a    with PaperMod: $b" >&2
            echo "  only in the PaperMod build: ${only_with:-<nothing>}" >&2
            echo "  only in the no-base-theme build: ${only_without:-<nothing>}" >&2
            exit 1
          fi
          echo "base theme contributes only 404.html ($a pages without, $b with)"
