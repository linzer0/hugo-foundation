<body class="fn-body">
  <a class="fn-skip-link" href="#main">Skip to content</a><div class="fn-shell"><header class="fn-hero fn-hero--align-start">

    <h1 class="fn-hero__title">Gallery smoke test</h1>
    <p class="fn-hero__lead">Exercises the gallery shortcode against a single page resource.</p>

  <main class="fn-shell__main" id="main"><p>A page bundle with one image. The <code>gallery</code> shortcode matches it through

<div class="gallery-container">
    
</div><dialog class="gallery-dialog" data-gallery-dialog aria-label="Image preview">

        <img class="gallery-dialog__image" data-gallery-dialog-image alt="">
        <figcaption class="gallery-dialog__caption" data-gallery-dialog-caption></figcaption>
    </figure>
    <button class="gallery-dialog__close" type="button" data-gallery-dialog-close aria-label="Close image preview">&times;</button>
</dialog><script defer src="/js/gallery-dialog.min.HASH.js" integrity="sha256-INTEGRITY"></script>
</main>
</div>
