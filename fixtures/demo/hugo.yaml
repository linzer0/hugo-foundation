baseURL: "https://fixture.example/"
title: "Foundation Fixture"

# Fixture-local wiring.
#
# `themesDir: "."` puts the theme lookup next to this file instead of inside a
# themes/ subdirectory, so the fixture can reach two things at once:
#   skins/skin-a  -> a skin sitting beside the site
#   ../..         -> the Foundation repository itself, two levels up
#
# A real consumer wires the Foundation as a git submodule under themes/, which
# is what linzer0.github.io does. The fixture cannot use a submodule, so it
# points at the checkout directly.
#
# Order matters: the skin is declared before the Foundation, so a skin that
# ever ships a template wins over the Foundation's. See docs/CONTRACTS.md §2.
themesDir: "."
theme:
  - skins/skin-a
  - ../..

disableKinds:
  - taxonomy
  - term
  - rss
  - sitemap

# The Foundation ships layouts/llms.txt so that a site with no base theme still
# has something to render llms.txt — the alternative is Hugo's "found no layout
# file for llms for kind home" warning, which the no-base-theme build used to
# emit. Declaring the format here is what puts that template on the path, and it
# is what a consumer has to do too. Without this block the fixture never renders
# llms.txt at all, so the template would be shipped and never verified.
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true
outputs:
  home:
    - HTML
    - llms

params:
  env: fixture
  skin: skin-a
